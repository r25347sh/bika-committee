<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="美化委員会 幹部紹介 — 委員長・副委員長・顧問の先生方">
  <meta name="theme-color" content="#f4f1ea">
  <title>幹部 · 美化委員会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/play.css">
  <link rel="stylesheet" href="css/menu.css?v=menu2">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient-gradient"></div>
    <div class="ambient-grid"></div>
    <div class="ambient-orbs">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
    </div>
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="ripple ripple-1"></div>
    <div class="ripple ripple-2"></div>
    <div class="ripple ripple-3"></div>
  </div>
  <canvas id="dust-canvas" aria-hidden="true"></canvas>

  <div class="page-wrap">
    <header class="hero" style="padding-bottom: 2.5rem;">
      <div class="container">
        <div class="hero-badge">幹部紹介</div>
        <h1>幹部</h1>
        <p class="hero-sub">美化委員会を支えるメンバーです。</p>
      </div>
    </header>

    <section class="section" style="padding-top: 0;">
      <div class="container">
        <div class="section-header reveal">
          <p class="eyebrow">Leaders</p>
          <h2>委員長・副委員長</h2>
        </div>
        <div class="cadre-grid" style="max-width: 640px; margin: 0 auto 3rem;">
          <article class="card cadre-card featured reveal reveal-delay-1">
            <div class="role">委員長</div>
            <div class="cadre-avatar" aria-hidden="true">晴</div>
            <h3>佐藤 晴</h3>
            <p class="meta">5年G組 · さとう はる</p>
            <p class="meta" style="margin-top:0.5rem;font-size:0.82rem;">S·A·T·O　H·A·R·U</p>
          </article>
          <article class="card cadre-card reveal reveal-delay-2">
            <div class="role">副委員長</div>
            <div class="cadre-avatar" aria-hidden="true">哲</div>
            <h3>小倉 哲史</h3>
            <p class="meta">5年D組 · おぐら さとし</p>
          </article>
        </div>

        <div class="section-header reveal">
          <p class="eyebrow">Advisors</p>
          <h2>顧問の先生方</h2>
        </div>
        <div class="cadre-grid">
          <article class="card cadre-card teacher reveal reveal-delay-1">
            <div class="role">顧問</div>
            <div class="cadre-avatar" aria-hidden="true">柴</div>
            <h3>柴本先生</h3>
            <p class="meta">顧問</p>
          </article>
          <article class="card cadre-card teacher reveal reveal-delay-2">
            <div class="role">顧問</div>
            <div class="cadre-avatar" aria-hidden="true">後</div>
            <h3>後藤先生</h3>
            <p class="meta">顧問</p>
          </article>
          <article class="card cadre-card teacher reveal reveal-delay-3">
            <div class="role">顧問</div>
            <div class="cadre-avatar" aria-hidden="true">秋</div>
            <h3>秋元先生</h3>
            <p class="meta">顧問</p>
          </article>
          <article class="card cadre-card teacher reveal reveal-delay-4">
            <div class="role">顧問</div>
            <div class="cadre-avatar" aria-hidden="true">増</div>
            <h3>増渋先生</h3>
            <p class="meta">ますぶち · 顧問</p>
          </article>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <p><strong>美化委員会</strong> · 脱ハウスダスト</p>
      <p>ご協力よろしくお願いします</p>
      <p style="margin-top:0.75rem;"><a href="https://r25347sh.github.io/bika-reform/">🚀 改革計画サイトへ</a></p>
    </footer>
  </div>

  <button type="button" class="ham-fab" id="ham-fab" aria-label="メニュー" aria-expanded="false" aria-controls="ham-panel">
    <span class="ham-fab-icon" aria-hidden="true">☰</span>
  </button>
  <nav class="ham-panel" id="ham-panel" aria-hidden="true">
    <a class="ham-link" href="index.html"><span class="ham-icon" aria-hidden="true">⌂</span><span>INDEX</span></a>

  <script src="js/play.js" defer></script>

    <span class="portal-icon" aria-hidden="true">🚀</span>
    <span>改革計画へ</span>
  </a>
</body>
</html>
